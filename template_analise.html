<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x</title>
<style>
/*__BRAND__*/
*{box-sizing:border-box}
html{scroll-padding-top:64px}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.55 var(--font-sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--brand)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.kicker{margin:0 0 6px;font:500 11.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:90;background:var(--card);padding:6px 10px;border-radius:8px}
svg{flex:none}
.bt svg,.share svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- cabeçalho (mesmo do painel /ao-vivo/, com "Análise" ativa) */
.hud-top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap;position:relative;z-index:40}
.marca{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-family:var(--font-mono);font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.marca .dim{color:var(--muted);margin-left:.45em}
.marca .cursor{display:inline-block;width:.5em;height:1.05em;background:var(--brand);margin-left:2px;vertical-align:-.15em}
.marca .sep{color:var(--line)}
.seg{display:flex;gap:2px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button,.seg a{border:0;background:none;color:var(--ink2);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap;text-decoration:none}
.seg button:hover,.seg a:hover{color:var(--ink)}
.seg button[aria-pressed=true],.seg a[aria-current=page]{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand),inset 0 0 0 1px var(--line)}
.hud-top .voltar{margin-left:auto;font-size:13px;color:var(--ink2)}

/* ---------- barra do recorte (fica no topo ao rolar) */
.barra{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.barra .in{max-width:1040px;margin:0 auto;padding:8px 16px;display:flex;gap:14px;align-items:center}
.uf-sel{display:flex;align-items:center;gap:8px;font:500 11.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none}
.uf-sel select{font:500 14px var(--font-sans);letter-spacing:0;text-transform:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:190px}
.indice{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,black 92%,transparent)}
.indice::-webkit-scrollbar{display:none}
.indice a{font-size:12.5px;color:var(--ink2);text-decoration:none;white-space:nowrap;padding:4px 9px;border-radius:999px}
.indice a:hover{background:var(--soft);color:var(--ink)}

/* ---------- corpo */
.corpo{max-width:1040px;margin:0 auto;padding:8px 16px 40px}
.abre{padding:26px 0 8px}
.abre h1{font:600 clamp(26px,4.2vw,40px)/1.12 var(--font-mono);letter-spacing:-.025em;margin:0 0 12px;max-width:900px}
.lead{font-size:17px;color:var(--ink2);max-width:760px;margin:0}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:18px 0}
.sec h2{font:600 clamp(19px,2.6vw,24px)/1.25 var(--font-mono);letter-spacing:-.02em;margin:0 0 10px;max-width:860px}
.h3{font:600 14px/1.35 var(--font-sans);color:var(--ink);margin:22px 0 8px}
.kpi{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.kpi b{font:600 clamp(34px,5vw,48px)/1 var(--font-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink2);font-size:14px;max-width:520px}
.nota{color:var(--muted);font-size:13px;margin:6px 0 10px}
.resumo{font-size:16px;color:var(--ink2);max-width:760px;margin:0 0 8px}
.vazio-txt{color:var(--muted);font-size:14px}
.badge{display:inline-block;font:500 11px/1.6 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border:1px dashed var(--amber);border-radius:999px;padding:0 8px}
.entenda{margin:16px 0 0;border-top:1px solid var(--line);padding-top:10px}
.entenda summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.entenda p{color:var(--ink2);font-size:14.5px;max-width:760px}
.fonte{margin:12px 0 0;font-size:12px;color:var(--muted)}
.fonte a{color:var(--ink2)}
.share{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.bt{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;text-decoration:none}
.bt:hover{border-color:var(--muted)}
.bt.ic{padding:7px;border-radius:50%;width:32px;height:32px;justify-content:center}
.link{border:0;background:none;padding:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.sec>.seg{margin:4px 0 10px}

/* ---------- destaques */
.destaques{background:none;border:0;padding:0}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;height:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink);text-decoration:none}
.card:hover{border-color:var(--muted)}
.c-n{font:600 30px/1.05 var(--font-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.c-t{font-size:14px;font-weight:600;line-height:1.35}
.c-x{font-size:13px;color:var(--ink2)}
.card .badge{align-self:flex-start;margin-top:auto}

/* ---------- gráficos */
.ch{width:100%;margin:6px 0 4px}
.ch svg{display:block;overflow:visible}
.ch text{font:12px var(--font-sans);fill:var(--ink2)}
.ch .rl{fill:var(--ink);font-size:12.5px}
.ch .rl .sub{fill:var(--muted);font-size:12px}
.ch .vl{fill:var(--bg);font:600 12px var(--font-mono)}
.ch .vl2{fill:var(--ink);font:600 12px var(--font-mono)}
.ch .ax{fill:var(--muted);font:12px var(--font-mono)}
.ch .gr{stroke:var(--line);stroke-width:1}
.ref{stroke:var(--ink2);stroke-dasharray:3 3;stroke-width:1}
.ch .faixa{fill:var(--ink2);opacity:.28}
.ch .ic{stroke:var(--ink);stroke-width:1.5;opacity:.75}
.ch .mq{stroke:var(--ink);stroke-width:2}
.mk{outline:none;cursor:default}
.mk:focus-visible rect,.mk:focus-visible circle,.mk:focus-visible line{stroke:var(--ink);stroke-width:2}
.mk:hover rect{filter:brightness(1.12)}
.leg-h,.leg-l{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 6px;font-size:12.5px;color:var(--ink2)}
.leg-h span,.leg-l span{display:inline-flex;align-items:center;gap:6px}
.leg-h i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--ink2)}
.leg-h i.f{background:var(--ink2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:6px;flex:none;vertical-align:-1px}
.chips{list-style:none;margin:8px 0 4px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;color:var(--ink2)}
.chips b{font-family:var(--font-mono);color:var(--ink);margin-left:4px}
.disp{position:relative;padding-bottom:4px}
.disp canvas{display:block;outline-offset:2px}
.eixo-x,.eixo-y{margin:0;font-size:12px;color:var(--muted)}
.eixo-x{text-align:right}
.eixo-y{position:absolute;top:0;left:50px}
.pm{list-style:none;margin:8px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pm li{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pm-t{margin:0;font-size:12.5px;color:var(--ink2)}
.pm-n{margin:2px 0 8px;font:600 22px var(--font-mono);font-variant-numeric:tabular-nums}
.pm-g{width:100%;height:60px;display:block;border-radius:4px}
.desc{margin:6px 0;padding-left:18px;color:var(--ink2);font-size:13.5px}
.tab-w{overflow-x:auto;margin:6px 0}
.tab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tab th,.tab td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tab thead th{color:var(--muted);font-weight:500;font-size:12px}
.tab tbody th{font-weight:600}
.tab small{color:var(--muted);font-weight:400;font-size:12px}
.tab .n{text-align:right}
.tab tr.realce{background:var(--soft)}
.tab tr.antes th,.tab tr.antes td{color:var(--muted)}.tab tr.antes a{color:var(--muted)}
.tab .antes-t{display:inline-block;margin-left:4px;padding:0 5px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.tab.lados td{font-size:12.5px}
.exc{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 5px}
.lado-a-lado{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.lado-a-lado>div{min-width:0}
.frases{margin:8px 0;padding-left:18px}.frases li{margin:4px 0}

/* ---------- mapa (o mesmo do painel, embutido) */
.mapa-box{position:relative;height:min(520px,110vw);min-height:340px;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.mapa{position:absolute;inset:0;background:var(--bg)}
.mapa-cv{display:block;cursor:grab;outline-offset:-3px}
.mapa-cv.arrastando{cursor:grabbing}
.mapa-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);margin:0}
.rotulos{position:absolute;inset:0;pointer-events:none}
.mapa-box .zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.mapa-box .zoom .bt{font:600 16px var(--font-mono);background:color-mix(in srgb,var(--card) 88%,transparent)}

/* ---------- dica */
.dica{position:fixed;left:0;top:0;z-index:70;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:180px;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-size:12.5px}
.dk-t{margin:0 0 6px;font-weight:600;font-size:13px}
.dk-r{margin:3px 0;display:flex;align-items:center;gap:4px}
.dk-r span{flex:1;color:var(--ink2)}
.dk-r b{font:600 12.5px var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- FAQ */
.sec.faq details{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0;margin:0}
.faq summary{cursor:pointer;font-weight:600}
.faq p{color:var(--ink2);margin:8px 0 0}

@media (max-width:640px){
  body{font-size:14.5px}
  .hud-top{padding:10px 12px;gap:8px}
  .hud-top .seg{order:3;width:100%}
  .barra .in{padding:8px 12px;gap:10px}
  .uf-sel>span{display:none}
  .corpo{padding:4px 12px 32px}
  .sec{padding:16px 14px;border-radius:12px}
  .share .bt span{display:none}.share .bt{padding:7px;width:40px;height:40px;justify-content:center;border-radius:50%}
  /* celular (issue 146): todo controle com 40 px de altura */
  .marca{min-height:40px;box-sizing:border-box}
  .hud-top .voltar,.seg a,.indice a{display:inline-flex;align-items:center;min-height:40px;box-sizing:border-box}
  .seg button{min-height:40px;box-sizing:border-box}
  .bt{min-height:40px;box-sizing:border-box}.bt.ic{width:40px;height:40px}
  .uf-sel select{min-height:40px;box-sizing:border-box}
  .link{min-height:40px;box-sizing:border-box}
  .entenda summary,.faq summary{min-height:40px;box-sizing:border-box;padding-block:10px;margin-block:-10px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<header class="hud-top">
  <a class="marca" href="/" aria-label="Eleições 2026, por Vitor Pereira (início)">
    <span class="wm">vitor<span class="dim">pereira</span><span class="cursor" aria-hidden="true"></span></span>
    <span class="sep" aria-hidden="true">/</span><span class="ctx">eleições 2026</span>
  </a>
  <!--__SECOES__-->
  <nav class="seg cargos" aria-label="Painel por cargo e análise">
    <a href="/ao-vivo/?cargo=presidente">Presidente</a><a href="/ao-vivo/?cargo=governador">Governadores</a><a href="/ao-vivo/?cargo=senador">Senado</a><a href="/ao-vivo/?cargo=depfed">Dep. Federal</a><a href="/ao-vivo/?cargo=depest">Dep. Estadual</a><a href="/analise/" aria-current="page">Análise</a>
  </nav>
  <a class="voltar" href="/ao-vivo/">Mapa ao vivo →</a>

  <!--__TEMA__-->
</header>
<main id="conteudo"><div id="analise"></div></main>

</body>
</html>
