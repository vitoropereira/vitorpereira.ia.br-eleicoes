# Três gatilhos: push na main (publicação contínua, a cada merge), cron diário e disparo manual.
# Anti-loop: o push do próprio lote cai em paths-ignore. O concurrency deixa no máximo 1 rodando + 1 pendente.
# Lote diário do Rastro do dinheiro. O merge só acontece dentro de rastro/lote.py, e só se `python3 -m pytest -q` passar
# sobre o conteúdo exato do lote; se falhar, o PR fica aberto com o label `bloqueado`. A trava de data fica no lote.py (desligada desde 21/10/2026).
# Horários (UTC): 11:17 principal, 13:17 reserva e 15:07 alerta. O lote é idempotente (PR mergeado "Rastro: lote <dia>"
# => sai com 0), então qualquer cron pode rodar sem duplicar. No alerta, `lote.py --conferir` falha se o dia não teve lote.
# Pré-requisitos (README do rastro): secret RASTRO_SAL, vars GA_ID e CLARITY_ID, label `bloqueado` e
# "Allow GitHub Actions to create and approve pull requests" ligado.
name: rastro-lote

on:
  push:
    branches: [main]
    paths-ignore:  # o que o próprio lote commita (CAMINHOS_GIT em rastro/lote.py); evita loop
      - "site/**"
      - "rastro/publicados.json"
      - "rastro/fila.json"
  schedule:
    - cron: "17 11 * * *"  # 08:17 BRT, principal (minuto quebrado: o minuto cheio atrasa horas)
    - cron: "17 13 * * *"  # reserva; idempotente, sai com 0 se o principal já publicou
    - cron: "7 15 * * *"  # alerta: o step Conferir deixa o run vermelho se o dia acabar sem lote
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só imprime o lote e os comandos, sem gravar nada"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rastro-lote
  cancel-in-progress: false

jobs:
  lote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências de teste
        run: pip install pytest

      - name: Sal do MEI
        env:
          RASTRO_SAL: ${{ secrets.RASTRO_SAL }}
        run: |
          # Sem o sal os ids de MEI publicados mudariam: falha antes de qualquer outra coisa.
          if [ -z "$RASTRO_SAL" ]; then
            echo "secret RASTRO_SAL vazio ou ausente; nada publicado." >&2
            exit 1
          fi
          printf '%s' "$RASTRO_SAL" > rastro/.sal

      - name: Lote
        env:
          GH_TOKEN: ${{ github.token }}
          GA_ID: ${{ vars.GA_ID }}
          CLARITY_ID: ${{ vars.CLARITY_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 rastro/lote.py --dry-run
          else
            python3 rastro/lote.py
          fi

      - name: Conferir
        if: always() && github.event.schedule == '7 15 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Um lote bloqueado deixa a branch do dia em checkout; a fila tem de ser lida do main.
          git reset --hard --quiet
          git checkout --quiet main
          python3 rastro/lote.py --conferir
